<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EPR, PPWR and DPP Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<header class="bar">
  <button type="button" class="iconbtn" id="toggle-filters" aria-controls="filters" aria-expanded="true" title="Show or hide filters">
    <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 5h14M6 10h8M8.5 15h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
    <span>Filters</span>
  </button>
  <div class="brand"><b>EPR, PPWR and DPP Explorer</b></div>
  <div class="views" role="group" aria-label="View">
    <button type="button" id="v-flow" aria-pressed="true">Flowchart</button>
    <button type="button" id="v-table" aria-pressed="false">Table</button>
    <button type="button" id="v-check" aria-pressed="false">Checklist</button>
    <button type="button" id="v-sku" aria-pressed="false">SKU data</button>
  </div>
  <div class="zoom" id="zoom" role="group" aria-label="Zoom">
    <button type="button" class="iconbtn" id="z-out" title="Zoom out" aria-label="Zoom out">−</button>
    <button type="button" class="iconbtn" id="z-fit" title="Fit to screen">Fit</button>
    <button type="button" class="iconbtn" id="z-in" title="Zoom in" aria-label="Zoom in">+</button>
  </div>
  <input class="search" id="q" type="search" placeholder="Search data points" aria-label="Search data points">
  <div class="export">
    <button type="button" class="iconbtn" id="export-btn" aria-haspopup="true" aria-expanded="false" aria-controls="export-menu">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 3v9m0 0l-3.5-3.5M10 12l3.5-3.5M4 15h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <span>Export</span>
    </button>
    <div class="export-menu" id="export-menu" role="menu" hidden>
      <button type="button" role="menuitem" id="exp-pdf">Flowchart PDF</button>
      <button type="button" role="menuitem" id="exp-print">Print flowchart</button>
      <button type="button" role="menuitem" id="exp-xlsx">Table Excel</button>
      <button type="button" role="menuitem" id="exp-csv">Table CSV</button>
      <button type="button" role="menuitem" id="exp-cl-xlsx">Checklist Excel</button>
      <button type="button" role="menuitem" id="exp-cl-csv">Checklist CSV</button>
      <hr class="sku-exp" hidden>
      <button type="button" role="menuitem" class="sku-exp" id="exp-sku-xlsx" hidden>SKU data Excel</button>
      <button type="button" role="menuitem" class="sku-exp" id="exp-sku-plat" hidden>Platform import CSV</button>
      <button type="button" role="menuitem" class="sku-exp" id="exp-sku-map" hidden>Values and sources CSV</button>
    </div>
  </div>
</header>
<div class="toast" id="toast" role="status" hidden></div>
<div class="printarea" id="printarea" aria-hidden="true"></div>

<div class="chips" id="chips" aria-live="polite"></div>

<div class="body">
  <aside class="filters" id="filters" aria-label="Filters">
    <div class="filters-head">
      <b>Filters</b>
      <div class="filters-actions">
        <button type="button" class="link" id="reset">Reset</button>
        <button type="button" class="iconbtn small" id="hide-filters" title="Hide filters" aria-label="Hide filters">×</button>
      </div>
    </div>
    <div class="profile">
      <label for="profile"><b>Client profile</b></label>
      <select id="profile"></select>
    </div>
    <div id="filter-groups"></div>
  </aside>

  <main class="workspace">
    <section class="canvas" id="canvas" aria-label="Flowchart">
      <div class="stage" id="stage">
        <svg class="wires" id="wires" aria-hidden="true"></svg>
        <div id="nodes"></div>
      </div>
      <div class="empty" id="empty" hidden>No data points match.</div>
    </section>
    <section class="tableview" id="tableview" hidden>
      <table>
        <thead><tr><th>ID</th><th>Data point</th><th>Client has it?</th><th>Comes from</th><th id="th-field">System / field (example)</th><th>Goes into</th><th>Countries</th><th>Applies from</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
    <section class="clview" id="clview" hidden aria-label="Client checklist">
      <div class="clhead">
        <div class="clhead-row">
          <label class="clclient">Client <input type="text" id="cl-client" placeholder="Client name" autocomplete="off"></label>
          <div class="clactions">
            <button type="button" class="iconbtn" id="cl-goflow">Show in flowchart</button>
            <button type="button" class="iconbtn" id="cl-import">Import CSV</button>
            <button type="button" class="link" id="cl-clear">Clear answers</button>
            <input type="file" id="cl-file" accept=".csv,text/csv" hidden>
          </div>
        </div>
        <div id="cl-progress"></div>
      </div>
      <div id="cl-groups"></div>
    </section>
    <section class="skuview" id="skuview" hidden aria-label="SKU data"></section>
  </main>

  <aside class="drawer" id="drawer" hidden aria-live="polite"></aside>
  <button type="button" class="drawer-tab" id="drawer-tab" hidden></button>
</div>

<script src="src/data.js"></script>
<script src="src/skudata.js"></script>
<script src="src/app.js"></script>
<script src="src/sku.js"></script>
</body>
</html>
