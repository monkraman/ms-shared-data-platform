<div class="shell" [class.menu-open]="menuOpen()">
  <nav id="sidebar" class="sidebar" aria-label="Main">
    <a class="brand" routerLink="/app" [title]="session.workspaceName()">
      <span class="mark" aria-hidden="true">{{ session.workspaceName().charAt(0) }}</span>
      <span class="workspace">{{ session.workspaceName() }}</span>
    </a>

    <div class="groups">
      @for (group of nav(); track group.label) {
        <div class="group">
          <div class="group-label">{{ group.label }}</div>
          <ul>
            @for (item of group.items; track item.path) {
              <li>
                <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">
                  <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
                       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path [attr.d]="item.icon" />
                  </svg>
                  {{ item.label }}
                </a>
              </li>
            }
          </ul>
        </div>
      }
    </div>

    <div class="user">
      <span class="avatar" aria-hidden="true">{{ initials() }}</span>
      <span class="who">
        <span class="name">{{ name() }}</span>
        <span class="role">{{ role() }}</span>
      </span>
      <button type="button" class="signout" (click)="signOut()" aria-label="Sign out" title="Sign out">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 13.5H3.5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1H6M10.5 11 13.5 8l-3-3M13.5 8H6" />
        </svg>
      </button>
    </div>
  </nav>

  <div class="backdrop" (click)="menuOpen.set(false)" aria-hidden="true"></div>

  <div class="main">
    <header class="topbar">
      <button type="button" class="menu" (click)="menuOpen.set(!menuOpen())" aria-label="Menu"
              [attr.aria-expanded]="menuOpen()" aria-controls="sidebar">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" />
        </svg>
      </button>
      @if (canSearch()) {
        <form class="search" role="search" (submit)="$event.preventDefault(); search(q.value)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <circle cx="7" cy="7" r="4.5" /><path d="m10.5 10.5 3 3" />
          </svg>
          <input #q type="search" placeholder="Search SKUs, products or GTINs" aria-label="Search products" />
        </form>
      }
    </header>

    <main class="page">
      <router-outlet />
    </main>
  </div>
</div>

<app-toast-outlet />
