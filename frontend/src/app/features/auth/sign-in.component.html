<div class="auth-wrapper" id="sign-in-screen">
  <main class="auth-card">
    <header class="auth-header">
      <div class="header-top-row">
        <div class="brand-badge">
          <span class="brand-monogram" aria-hidden="true">C</span>
          <span class="brand-title">Compliance Hub</span>
        </div>
        <button
          type="button"
          class="btn-theme-toggle"
          (click)="themeService.toggleTheme()"
          [attr.aria-label]="themeService.theme() === 'light' ? 'Dark mode' : 'Light mode'"
        >
          {{ themeService.theme() === 'light' ? 'Dark' : 'Light' }}
        </button>
      </div>
      <h1 class="auth-headline">Sign in</h1>
    </header>

    @if (errorMessage()) {
      <div class="alert-banner alert-error" role="alert">{{ errorMessage() }}</div>
    } @else if (notice()) {
      <div class="alert-banner alert-info" role="status">{{ notice() }}</div>
    }

    <form [formGroup]="signInForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
      <div class="form-field">
        <label for="work-email" class="field-label">Work email</label>
        <input
          id="work-email"
          type="email"
          formControlName="email"
          class="field-input"
          autocomplete="username"
          [attr.aria-invalid]="!!fieldError('email')"
          [attr.aria-describedby]="fieldError('email') ? 'work-email-error' : null"
        />
        @if (fieldError('email'); as msg) {
          <span id="work-email-error" class="field-error">{{ msg }}</span>
        }
      </div>

      <div class="form-field">
        <label for="work-password" class="field-label">Password</label>
        <div class="input-wrapper">
          <input
            id="work-password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            class="field-input with-toggle"
            autocomplete="current-password"
            [attr.aria-invalid]="!!fieldError('password')"
            [attr.aria-describedby]="fieldError('password') ? 'work-password-error' : null"
          />
          <button
            type="button"
            class="btn-toggle-pw"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          >
            {{ showPassword() ? 'Hide' : 'Show' }}
          </button>
        </div>
        @if (fieldError('password'); as msg) {
          <span id="work-password-error" class="field-error">{{ msg }}</span>
        }
      </div>

      <button type="submit" class="btn-primary-action" [disabled]="authenticating()" id="btn-sign-in">
        {{ authenticating() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    @if (presets.length) {
      <div class="auth-presets">
        <div class="preset-buttons">
          @for (p of presets; track p.email) {
            <button type="button" class="preset-btn" (click)="applyPreset(p.email)">{{ p.label }}</button>
          }
        </div>
      </div>
    }
  </main>
</div>
