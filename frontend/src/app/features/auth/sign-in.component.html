<div class="auth-wrapper" id="sign-in-screen">

  <div class="auth-card">

    <!-- Brand Header -->
    <header class="auth-header">
      <div class="header-top-row">
        <div class="brand-badge">
          <span class="brand-monogram">C</span>
          <span class="brand-title">Compliance Hub</span>
        </div>

        <!-- Theme Toggle -->
        <button
          type="button"
          class="btn-theme-toggle"
          (click)="themeService.toggleTheme()"
          [title]="'Switch to ' + (themeService.theme() === 'light' ? 'Dark' : 'Light') + ' Mode'"
        >
          <span>{{ themeService.theme() === 'light' ? 'Dark' : 'Light' }}</span>
        </button>
      </div>

      <h1 class="auth-headline">Sign In</h1>
      <p class="auth-subline">
        Multi-Tenant FMCG Packaging & Compliance Platform
      </p>
    </header>

    <!-- Error Alert Banner -->
    @if (errorMessage()) {
      <div class="alert-banner alert-error" role="alert">
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <!-- Direct Email & Password Form -->
    <form [formGroup]="signInForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
      
      <div class="form-field">
        <label for="work-email" class="field-label">Work Email</label>
        <input
          id="work-email"
          type="email"
          formControlName="email"
          class="field-input"
          placeholder="name@company.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-field">
        <label for="work-password" class="field-label">Password</label>
        <div class="input-wrapper">
          <input
            id="work-password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            class="field-input with-toggle"
            placeholder="••••••••••••"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="btn-toggle-pw"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          >
            {{ showPassword() ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="btn-primary-action"
        [disabled]="authenticating()"
        id="btn-sign-in"
      >
        @if (authenticating()) {
          <span>Authenticating...</span>
        } @else {
          <span>Sign In →</span>
        }
      </button>

    </form>

    <!-- 1-Click Quick Preset Buttons for Instant Verification -->
    <div class="auth-presets">
      <span class="preset-label">Quick Sign-In Presets:</span>
      <div class="preset-buttons">
        <button
          type="button"
          class="preset-btn"
          (click)="applyPreset('superadmin')"
        >
          SuperAdmin
        </button>
        <button
          type="button"
          class="preset-btn"
          (click)="applyPreset('khc_admin')"
        >
          Kraft Heinz (Org Admin)
        </button>
      </div>
    </div>

  </div>

</div>
