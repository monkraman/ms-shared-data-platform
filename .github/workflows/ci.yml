name: CI

on:
  pull_request:
  push:
    # main plus the working branches of the build plan (step-0/..., screen/NN-name)
    branches: [main, "step-*/**", "screen/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      # Superuser URL used only to create a non-superuser role and a throwaway database,
      # so Row-Level Security is tested the way the app runs in production.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Lint new foundation code
        run: |
          ruff check $NEW_CODE
          ruff format --check $NEW_CODE
        env:
          NEW_CODE: >-
            app/core/auth.py app/core/audit.py app/core/config.py app/core/db.py app/core/errors.py
            app/core/jobs.py app/core/permissions.py app/core/request_context.py app/core/tenancy.py
            app/platform app/api/v1/jobs.py app/api/v1/health.py app/seed.py app/worker.py app/models.py
            migrations tests/test_foundation.py tests/conftest.py
      - name: Tests (including PostgreSQL RLS and tenant isolation)
        run: python -m pytest -q -rs --junitxml=junit.xml
      - name: Report failing tests as annotations
        if: failure()
        run: python scripts/junit_annotations.py junit.xml
      - name: Database tests must not be skipped in CI
        run: python -m pytest -q tests/test_foundation.py -rs | tee /tmp/db.txt && ! grep -q "SKIPPED" /tmp/db.txt

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration development
      - run: npm run test:ci

  api-contract:
    name: API client matches the backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r backend/requirements.txt
      - name: Regenerate OpenAPI and TypeScript types
        working-directory: frontend
        run: |
          python ../backend/scripts/export_openapi.py src/app/core/api/openapi.json
          npx --yes openapi-typescript@7.13.0 src/app/core/api/openapi.json -o src/app/core/api/schema.ts
      - name: Fail if the committed client is out of date (run `npm run api:generate` in frontend/)
        run: git diff --exit-code -- frontend/src/app/core/api
